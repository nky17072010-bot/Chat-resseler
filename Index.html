<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat dengan Owner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col justify-between">
    <header class="bg-slate-800 p-4 shadow text-center font-bold text-sm">
        💬 Kirim Pesan ke Owner (Real-Time)
    </header>

    <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

    <div class="bg-slate-800 p-3 flex gap-2">
        <input type="text" id="username-input" placeholder="Nama Anda" class="bg-slate-700 text-xs px-3 py-2 rounded-lg text-white w-28 focus:outline-none">
        <input type="text" id="message-input" placeholder="Tulis pesan..." class="flex-1 bg-slate-700 text-sm text-white px-3 py-2 rounded-lg focus:outline-none" autocomplete="off">
        <button onclick="sendMessage()" class="bg-indigo-600 px-4 py-2 rounded-lg text-sm font-semibold">Kirim</button>
    </div>

    <script>
        const socket = io();
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');
        const usernameInput = document.getElementById('username-input');

        usernameInput.value = "Tamu_" + Math.floor(Math.random() * 1000);

        function scrollToBottom() { chatBox.scrollTop = chatBox.scrollHeight; }

        socket.on('load_history', function(messages) {
            chatBox.innerHTML = "";
            messages.forEach(msg => {
                if (msg.sender === usernameInput.value || msg.receiver === usernameInput.value) {
                    appendMessage(msg);
                }
            });
            scrollToBottom();
        });

        socket.on('receive_message', function(msg) {
            if (msg.sender === usernameInput.value || msg.receiver === usernameInput.value) {
                appendMessage(msg);
                scrollToBottom();
            }
        });

        function sendMessage() {
            const text = messageInput.value.trim();
            const sender = usernameInput.value.trim();
            if (text !== "") {
                socket.emit('send_to_owner', { sender: sender, text: text });
                messageInput.value = "";
            }
        }

        messageInput.addEventListener("keypress", function(e) { if (e.key === "Enter") sendMessage(); });

        function appendMessage(msg) {
            const isMe = msg.sender !== 'Owner';
            const div = document.createElement('div');
            div.className = `flex flex-col max-w-[80%] ${isMe ? 'ml-auto items-end' : 'mr-auto items-start'} mb-2`;
            div.innerHTML = `
                <span class="text-[10px] text-slate-400 mb-0.5">${msg.sender} • ${msg.time}</span>
                <div class="px-3 py-2 rounded-lg text-xs break-words ${isMe ? 'bg-indigo-600 text-white' : 'bg-slate-700 text-slate-100'}">${msg.text}</div>
            `;
            chatBox.appendChild(div);
        }
    </script>
</body>
</html>
